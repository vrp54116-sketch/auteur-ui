<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevMetrics - All-in-One Cloud Observability</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #f1f5f9;
      color: #0f172a;
      padding: 40px 20px;
    }

    .dashboard-header {
      background: linear-gradient(90deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
      border-radius: 8px;
      padding: 40px;
      color: white;
      text-align: center;
      margin-bottom: 30px;
    }

    .dashboard-header h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .dashboard-header p {
      font-size: 16px;
      opacity: 0.9;
    }

    .stats-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      border-radius: 8px;
      padding: 24px;
      border: 1px solid #e2e8f0;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .stat-emoji {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: #6366f1;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 14px;
      color: #64748b;
    }

    .panel-box {
      background: white;
      border-radius: 8px;
      padding: 24px;
      border: 1px solid #e2e8f0;
      text-align: center;
    }

    .btn-purple {
      background: #8b5cf6;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 15px;
    }

    @media (max-width: 768px) {
      .stats-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="dashboard-header">
    <h1>DevMetrics Live Analytics 📊</h1>
    <p>Real-time cluster telemetry and distributed tracing monitoring</p>
  </div>

  <div class="stats-container">
    <div class="stat-card">
      <div class="stat-emoji">🚀</div>
      <div class="stat-value">99.999%</div>
      <div class="stat-label">Service Uptime SLA</div>
    </div>
    <div class="stat-card">
      <div class="stat-emoji">⚡️</div>
      <div class="stat-value">12.4 ms</div>
      <div class="stat-label">Global Median Latency</div>
    </div>
    <div class="stat-card">
      <div class="stat-emoji">💰</div>
      <div class="stat-value">$1,240</div>
      <div class="stat-label">Estimated Monthly Savings</div>
    </div>
  </div>

  <div class="panel-box">
    <h3>Live Event Stream</h3>
    <p style="color: #64748b; margin-top: 8px;">Everything is running smoothly across all 12 edge clusters.</p>
    <button class="btn-purple">View Detailed Logs &rarr;</button>
  </div>
</body>
</html>
